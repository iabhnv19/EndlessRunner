<svg xmlns="http://www.w3.org/2000/svg" width="46" height="32" viewBox="0 0 46 32">
  <!-- Head crown outline -->
  <rect x="10" y="6" width="8" height="2" fill="#111111" />

  <!-- Upper head & back outline -->
  <rect x="8" y="8" width="2" height="2" fill="#111111" />
  <rect x="10" y="8" width="2" height="2" fill="#cf8646" />
  <rect x="12" y="8" width="2" height="2" fill="#8f5122" />
  <rect x="14" y="8" width="2" height="2" fill="#b36b32" />
  <rect x="16" y="8" width="2" height="2" fill="#cf8646" />
  <rect x="18" y="8" width="20" height="2" fill="#111111" />

  <!-- Beak top + Eye + Back -->
  <rect x="0" y="10" width="10" height="2" fill="#111111" />
  <rect x="10" y="10" width="2" height="2" fill="#cf8646" />
  <rect x="12" y="10" width="2" height="2" fill="#ffffff" />
  <rect x="14" y="10" width="2" height="2" fill="#8f5122" />
  <rect x="16" y="10" width="20" height="2" fill="#cf8646" />
  <rect x="36" y="10" width="2" height="2" fill="#111111" />

  <!-- Beak middle + Body + Tail notch -->
  <rect x="0" y="12" width="2" height="2" fill="#111111" />
  <rect x="2" y="12" width="8" height="2" fill="#f5b324" />
  <rect x="10" y="12" width="2" height="2" fill="#b36b32" />
  <rect x="12" y="12" width="2" height="2" fill="#8f5122" />
  <rect x="14" y="12" width="20" height="2" fill="#b36b32" />
  <rect x="34" y="12" width="2" height="2" fill="#111111" />

  <!-- Beak bottom + Lower body -->
  <rect x="0" y="14" width="10" height="2" fill="#111111" />
  <rect x="10" y="14" width="2" height="2" fill="#8f5122" />
  <rect x="12" y="14" width="22" height="2" fill="#b36b32" />
  <rect x="34" y="14" width="2" height="2" fill="#8f5122" />
  <rect x="36" y="14" width="2" height="2" fill="#111111" />

  <!-- Belly outline + Wing base -->
  <rect x="8" y="16" width="2" height="2" fill="#111111" />
  <rect x="10" y="16" width="8" height="2" fill="#8f5122" />
  <rect x="18" y="16" width="2" height="2" fill="#cf8646" />
  <rect x="20" y="16" width="8" height="2" fill="#b36b32" />
  <rect x="28" y="16" width="8" height="2" fill="#8f5122" />
  <rect x="36" y="16" width="2" height="2" fill="#111111" />

  <!-- Wing flap downward -->
  <rect x="10" y="18" width="6" height="2" fill="#111111" />
  <rect x="16" y="18" width="2" height="2" fill="#111111" />
  <rect x="18" y="18" width="2" height="2" fill="#cf8646" />
  <rect x="20" y="18" width="8" height="2" fill="#b36b32" />
  <rect x="28" y="18" width="10" height="2" fill="#111111" />

  <rect x="16" y="20" width="2" height="2" fill="#111111" />
  <rect x="18" y="20" width="2" height="2" fill="#cf8646" />
  <rect x="20" y="20" width="6" height="2" fill="#b36b32" />
  <rect x="26" y="20" width="2" height="2" fill="#111111" />

  <rect x="18" y="22" width="2" height="2" fill="#111111" />
  <rect x="20" y="22" width="2" height="2" fill="#cf8646" />
  <rect x="22" y="22" width="2" height="2" fill="#b36b32" />
  <rect x="24" y="22" width="2" height="2" fill="#8f5122" />
  <rect x="26" y="22" width="2" height="2" fill="#111111" />

  <rect x="18" y="24" width="2" height="2" fill="#111111" />
  <rect x="20" y="24" width="2" height="2" fill="#cf8646" />
  <rect x="22" y="24" width="2" height="2" fill="#8f5122" />
  <rect x="24" y="24" width="2" height="2" fill="#111111" />

  <rect x="20" y="26" width="2" height="2" fill="#111111" />
  <rect x="22" y="26" width="2" height="2" fill="#b36b32" />
  <rect x="24" y="26" width="2" height="2" fill="#111111" />

  <rect x="20" y="28" width="2" height="2" fill="#111111" />
